name: Build desktop apps

# GitHub Actions minutes are limited on a private repository, and macOS minutes cost 10x (Windows 2x).
# So nothing builds automatically. The Mac apps are built on a Mac with `npm run release:mac`; this
# workflow builds the Windows installers (the one thing a Mac cannot build) when you ask for it:
#   gh workflow run build.yml -f tag=v0.1.9
# Add -f mac=true to also build both Mac apps on GitHub (about 10x the cost; normally unnecessary).
permissions:
  contents: write # lets a job attach installers to the release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the installers are attached to (for example v0.1.9). It must already exist."
        required: true
        type: string
      windows:
        description: "Build the Windows installers"
        type: boolean
        default: true
      mac:
        description: "Also build the Mac apps on GitHub (10x minutes)"
        type: boolean
        default: false

jobs:
  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Reuses compiled dependencies between builds, which is most of the build time (and the minutes).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app
        env:
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
        # Updater packages are signed on the maintainer's Mac (scripts/publish-update.mjs); the signing key is never given to GitHub.
        run: npx tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          files=(src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Grand Strategy Analyzer $TAG" --generate-notes
          gh release upload "$TAG" "${files[@]}" --clobber

  mac:
    if: ${{ inputs.mac }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - name: Build app
        env:
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
        run: npx tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Grand Strategy Analyzer $TAG" --generate-notes
          gh release upload "$TAG" src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg --clobber
