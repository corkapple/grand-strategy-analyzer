name: Build desktop apps

# Builds installers for macOS (Apple Silicon + Intel) and Windows.
# Run manually (Actions tab -> "Build desktop apps" -> Run workflow) or push a tag like v0.1.0.
# Pushing a tag also publishes a GitHub Release with every installer attached.
# Manual runs only produce downloadable "Artifacts".
permissions:
  contents: write # lets the release job publish to the Releases page

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
          - os: macos-15-intel # Intel runner (label may change; check GitHub's runner list)
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Node installed here is copied into the app as the bridge runtime
      # (scripts/prepare-bundle.mjs), so it must match the runner's OS/arch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app
        env:
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: grand-strategy-analyzer-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist-release -type f
          cat > notes.md <<'EOF'
          Unsigned builds, so your OS will warn on first launch.
          - **Windows:** run the `.exe` (or `.msi`). SmartScreen: More info -> Run anyway.
          - **macOS:** open the `.dmg` for your Mac (`aarch64` = Apple Silicon, `x64` = Intel), drag to Applications, then right-click -> Open the first time.
          EOF
          # File names contain spaces, so collect them into an array instead of splitting a string.
          mapfile -d '' files < <(find dist-release -type f -print0)
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "Grand Strategy Analyzer $TAG" \
            --generate-notes --notes-file notes.md
