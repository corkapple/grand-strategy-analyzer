name: Web app

# Builds the browser version of the app and publishes it on GitHub Pages
# (https://corkapple.github.io/grand-strategy-analyzer/). Runs when the app code changes on main.
on:
  push:
    branches: [main]
    paths: ["scripts/prepare-web-ocr.mjs", "src/**", "public/**", "index.html", "vite.config.ts", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-web-ocr.mjs
      - run: npm test
      - run: npm run build
        env:
          GSA_BASE: /grand-strategy-analyzer/
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
